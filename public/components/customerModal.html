<div id="customerModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="customerModalTitle">

                Add Customer

            </h2>

            <button id="closeCustomerModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    id="customerNameInput"
                    placeholder="Customer Name">

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    id="customerPhone"
                    placeholder="Phone Number">

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="customerEmail"
                    placeholder="Email">

            </div>

            <div class="form-group">

                <label>City</label>

                <input
                    type="text"
                    id="customerCity"
                    placeholder="City">

            </div>

            <div class="form-group">

                <label>Address</label>

                <textarea
                    id="customerAddress"
                    rows="3"
                    placeholder="Address"></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn-secondary"
                id="cancelCustomerBtn">

                Cancel

            </button>

            <button
                class="btn-primary"
                id="saveCustomerBtn">

                Save Customer

            </button>

        </div>

    </div>

</div>
