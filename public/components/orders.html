<div class="orders-page">

    <div class="products-header">

        <h2 class="page-title">

            Orders

        </h2>

        <button
            class="btn-primary"
            id="addOrderBtn">

            <i class="fa-solid fa-plus"></i>

            Create Order

        </button>

    </div>

    <div class="table-container">

        <table class="product-table">

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer</th>

                    <th>Product</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Date</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="orderTable">

                <tr>

                    <td colspan="8" style="text-align:center;padding:30px;">

                        Loading orders...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
