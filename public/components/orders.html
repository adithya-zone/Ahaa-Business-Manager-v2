<div class="orders-page">

    <div class="products-header">

        <h2 class="page-title">

            Orders

        </h2>

        <button
            class="btn-primary"
            id="addOrderBtn">

            <i class="fa-solid fa-plus"></i>

            Create Order

        </button>

    </div>

    <!-- Search & Filters -->

    <div
        style="
            margin:15px 0;
            display:flex;
            gap:12px;
            align-items:center;
            flex-wrap:wrap;
        ">

        <input
            id="orderSearch"
            type="text"
            placeholder="🔍 Search Order ID, Customer or Product..."
            onkeyup="searchOrders()"
            style="
                width:320px;
                padding:10px 14px;
                border:1px solid #dcdcdc;
                border-radius:8px;
                outline:none;
                font-size:14px;
            ">

        <select
            id="orderStatusFilter"
            onchange="filterOrders()"
            style="
                padding:10px 14px;
                border:1px solid #dcdcdc;
                border-radius:8px;
                outline:none;
                font-size:14px;
                min-width:180px;
            ">

            <option value="All">

                All Status

            </option>

            <option value="Pending">

                Pending

            </option>

            <option value="Completed">

                Completed

            </option>

            <option value="Cancelled">

                Cancelled

            </option>

        </select>

    </div>

    <div class="table-container">

        <table class="product-table">

            <thead>

                <tr>

                    <th>Order ID</th>

                    <th>Customer</th>

                    <th>Product</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>Date</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="orderTable">

                <tr>

                    <td
                        colspan="8"
                        style="
                            text-align:center;
                            padding:30px;
                        ">

                        Loading orders...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
