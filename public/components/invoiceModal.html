<div id="invoiceModal" class="modal">

    <div class="modal-content invoice-modal">

        <div class="modal-header">

            <h2>

                Invoice Preview

            </h2>

            <button id="closeInvoiceModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="modal-body">

            <div id="invoiceContent">

                <div class="invoice-header">

                    <h1>AHAA PICKLES</h1>

                    <p>Fresh & Homemade Pickles</p>

                </div>

                <hr>

                <div class="invoice-info">

                    <p>

                        <strong>Invoice No :</strong>

                        <span id="invoiceNumber"></span>

                    </p>

                    <p>

                        <strong>Date :</strong>

                        <span id="invoiceDate"></span>

                    </p>

                </div>

                <div class="invoice-customer">

                    <p>

                        <strong>Customer :</strong>

                        <span id="invoiceCustomer"></span>

                    </p>

                </div>

                <table class="invoice-table">

                    <thead>

                        <tr>

                            <th>Product</th>

                            <th>Qty</th>

                            <th>Price</th>

                            <th>Total</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td id="invoiceProduct"></td>

                            <td id="invoiceQty"></td>

                            <td id="invoicePrice"></td>

                            <td id="invoiceTotal"></td>

                        </tr>

                    </tbody>

                </table>

                <div class="invoice-grand-total">

                    <strong>

                        Grand Total :

                    </strong>

                    <span id="invoiceGrandTotal"></span>

                </div>

                <div class="invoice-footer">

                    Thank you for your purchase!

                </div>

            </div>

        </div>

        <div class="modal-footer">

            <button

                class="btn-secondary"

                id="printInvoiceBtn">

                <i class="fa-solid fa-print"></i>

                Print

            </button>

            <button

                class="btn-primary"

                id="downloadInvoiceBtn">

                <i class="fa-solid fa-file-pdf"></i>

                Download PDF

            </button>

        </div>

    </div>

</div>
