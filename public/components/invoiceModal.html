<div id="invoiceModal" class="modal">

    <div class="modal-content invoice-modal">

        <!-- ======================================
             Header
        ======================================= -->

        <div class="modal-header">

            <h2>

                <i class="fa-solid fa-file-invoice"></i>

                Invoice Preview

            </h2>

            <button
                type="button"
                id="closeInvoiceModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>


        <!-- ======================================
             Invoice Body
        ======================================= -->

        <div class="modal-body">

            <div
                id="invoiceContent"
                class="invoice-paper">


                <!-- Company Details -->

                <div class="invoice-company">

                    <h1 id="invoiceCompanyName">

                        AHAA BUSINESS MANAGER

                    </h1>

                    <p id="invoiceCompanyAddress"></p>

                    <p>

                        <strong>Phone:</strong>

                        <span
                            id="invoiceCompanyPhone">
                        </span>

                        &nbsp;&nbsp;&nbsp;

                        <strong>Email:</strong>

                        <span
                            id="invoiceCompanyEmail">
                        </span>

                    </p>

                </div>


                <hr>


                <!-- Invoice Information -->

                <table
                    class="invoice-info-table">

                    <tr>

                        <td>

                            <strong>
                                Invoice No
                            </strong>

                        </td>

                        <td id="invoiceNumber"></td>

                        <td>

                            <strong>
                                Date
                            </strong>

                        </td>

                        <td id="invoiceDate"></td>

                    </tr>


                    <tr>

                        <td>

                            <strong>
                                Customer
                            </strong>

                        </td>

                        <td id="invoiceCustomer"></td>

                        <td>

                            <strong>
                                Status
                            </strong>

                        </td>

                        <td id="invoiceStatus"></td>

                    </tr>

                </table>


                <br>


                <!-- ======================================
                     Products
                ======================================= -->

                <table class="invoice-table">

                    <thead>

                        <tr>

                            <th style="width:45%">

                                Product

                            </th>

                            <th>

                                Qty

                            </th>

                            <th>

                                Unit Price

                            </th>

                            <th>

                                Amount

                            </th>

                        </tr>

                    </thead>


                    <tbody id="invoiceItems">

                        <!-- Products inserted by invoice.js -->

                    </tbody>

                </table>


                <br>


                <!-- ======================================
                     Totals
                ======================================= -->

                <table class="invoice-total-table">

                    <tr>

                        <td>

                            Sub Total

                        </td>

                        <td id="invoiceTotalAmount">

                            ₹0.00

                        </td>

                    </tr>


                    <tr>

                        <td>

                            GST (0%)

                        </td>

                        <td id="invoiceGST">

                            ₹0.00

                        </td>

                    </tr>


                    <tr class="grand-total">

                        <td>

                            Grand Total

                        </td>

                        <td id="invoiceGrandTotal">

                            ₹0.00

                        </td>

                    </tr>

                </table>


                <!-- ======================================
                     Footer Note
                ======================================= -->

                <div class="invoice-note">

                    <h4>

                        Thank You!

                    </h4>

                    <p>

                        Thank you for choosing us.

                    </p>

                    <p>

                        This is a computer generated invoice.

                    </p>

                </div>


            </div>

        </div>


        <!-- ======================================
             Footer Buttons
        ======================================= -->

        <div class="modal-footer">

            <button
                type="button"
                class="btn-secondary"
                id="printInvoiceBtn">

                <i class="fa-solid fa-print"></i>

                Print

            </button>


            <button
                type="button"
                class="btn-primary"
                id="downloadInvoiceBtn">

                <i class="fa-solid fa-file-pdf"></i>

                Download PDF

            </button>

        </div>

    </div>

</div>
