<div class="products-header">
    <div style="margin:15px 0;">

    <input
        id="productSearch"
        type="text"
        placeholder="🔍 Search products..."
        onkeyup="searchProducts()"
        style="
            width:320px;
            padding:10px;
            border-radius:8px;
            border:1px solid #ddd;
        ">

</div>

    <h2 class="page-title">

        Products

    </h2>

    <button
        class="btn-primary"
        id="addProductBtn">

        <i class="fa-solid fa-plus"></i>

        Add Product

    </button>

</div>

<div class="table-container">

    <table class="product-table">

        <thead>

            <tr>

                <th>SKU</th>

                <th>Product</th>

                <th>Category</th>

                <th>Price</th>

                <th>Stock</th>

                <th>Status</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="productTable">

            <tr>

                <td colspan="7">

                    Loading products...

                </td>

            </tr>

        </tbody>

    </table>

</div>
