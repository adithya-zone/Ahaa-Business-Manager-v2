<div class="settings-page">

    <div class="products-header">

        <h2 class="page-title">

            Settings

        </h2>

    </div>

    <div class="table-container">

        <div style="padding:30px;max-width:700px;">

            <h3>Appearance</h3>

            <br>

            <div class="form-group">

                <label>Theme</label>

                <select id="themeSelect">

                    <option value="light">Light</option>

                    <option value="dark">Dark</option>

                </select>

            </div>

            <br>

            <div class="form-group">

                <label>Primary Color</label>

                <input
                    type="color"
                    id="themeColor"
                    value="#2563eb">

            </div>

            <hr style="margin:30px 0;">

            <h3>Company Information</h3>

            <br>

            <div class="form-group">

                <label>Company Name</label>

                <input
                    type="text"
                    id="companyName"
                    placeholder="Company Name">

            </div>

            <br>

            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    id="companyPhone">

            </div>

            <br>

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="companyEmail">

            </div>

            <br>

            <div class="form-group">

                <label>Address</label>

                <textarea
                    id="companyAddress"
                    rows="4"></textarea>

            </div>

            <br>

            <button
                id="saveSettingsBtn"
                class="btn-primary">

                Save Settings

            </button>

        </div>

    </div>

</div>
