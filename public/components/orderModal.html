<div id="orderModal" class="modal">

    <div
        class="modal-content"
        style="
            width: 650px;
            max-width: 95%;
        "
    >

        <!-- Header -->
        <div class="modal-header">

            <h2 id="orderModalTitle">
                Create Order
            </h2>

            <button
                type="button"
                id="closeOrderModal"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- Form -->
        <form id="orderForm">

            <div class="modal-body">

                <!-- Customer -->
                <div class="form-group">

                    <label>
                        Customer Name
                    </label>

                    <input
                        type="text"
                        id="orderCustomer"
                        placeholder="Walk-in Customer"
                        required
                    >

                </div>


                <!-- Products Section -->
                <div class="form-group">

                    <div
                        style="
                            display:flex;
                            justify-content:space-between;
                            align-items:center;
                            margin-bottom:10px;
                        "
                    >

                        <label
                            style="
                                margin:0;
                                font-weight:600;
                            "
                        >
                            Products
                        </label>

                        <button
                            type="button"
                            id="addOrderItemBtn"
                            class="btn-secondary"
                            style="
                                padding:7px 12px;
                                font-size:13px;
                            "
                        >
                            <i class="fa-solid fa-plus"></i>
                            Add Product
                        </button>

                    </div>


                    <!-- Column Headers -->

                    <div
                        style="
                            display:grid;
                            grid-template-columns:
                                minmax(160px, 2fr)
                                120px
                                100px
                                120px
                                45px;
                            gap:8px;
                            align-items:center;
                            margin-bottom:6px;
                            padding:0 2px;
                        "
                    >

                        <div
                            style="
                                font-size:12px;
                                font-weight:600;
                            "
                        >
                            Product
                        </div>

                        <div
                            style="
                                font-size:12px;
                                font-weight:600;
                            "
                        >
                            Weight (KG)
                        </div>

                        <div
                            style="
                                font-size:12px;
                                font-weight:600;
                            "
                        >
                            Quantity
                        </div>

                        <div
                            style="
                                font-size:12px;
                                font-weight:600;
                                text-align:right;
                            "
                        >
                            Amount
                        </div>

                        <div></div>

                    </div>


                    <!-- Dynamic Product Rows -->

                    <div id="orderItemsContainer"></div>


                    <!-- Grand Total -->

                    <div
                        style="
                            display:flex;
                            justify-content:flex-end;
                            align-items:center;
                            gap:10px;
                            margin-top:12px;
                            padding-top:10px;
                            border-top:1px solid #ddd;
                        "
                    >

                        <strong>
                            Total:
                        </strong>

                        <strong
                            id="orderGrandTotal"
                        >
                            ₹0.00
                        </strong>

                    </div>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label>
                        Status
                    </label>

                    <select
                        id="orderStatus"
                    >

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>


            <!-- Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-secondary"
                    id="cancelOrderBtn"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn-primary"
                    id="saveOrderBtn"
                >
                    Save Order
                </button>

            </div>

        </form>

    </div>

</div>
