<div id="orderModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="orderModalTitle">

                Create Order

            </h2>

            <button
                type="button"
                id="closeOrderModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="orderForm">

            <div class="modal-body">

                <div class="form-group">

                    <label>Customer Name</label>

                    <input
                        type="text"
                        id="orderCustomer"
                        placeholder="Walk-in Customer"
                        required>

                </div>

                <div class="form-group">

                    <label>Product</label>

                    <select
                        id="orderProduct"
                        required>

                        <option value="">

                            Select Product

                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Quantity</label>

                    <input
                        type="number"
                        id="orderQuantity"
                        min="1"
                        value="1"
                        required>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select id="orderStatus">

                        <option value="Pending">

                            Pending

                        </option>

                        <option value="Completed">

                            Completed

                        </option>

                        <option value="Cancelled">

                            Cancelled

                        </option>

                    </select>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-secondary"
                    id="cancelOrderBtn">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn-primary"
                    id="saveOrderBtn">

                    Save Order

                </button>

            </div>

        </form>

    </div>

</div>
