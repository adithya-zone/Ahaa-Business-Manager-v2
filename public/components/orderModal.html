<div id="orderModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="orderModalTitle">
                Create Order
            </h2>

            <button
                type="button"
                id="closeOrderModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="orderForm">

            <div class="modal-body">

                <!-- Customer -->

                <div class="form-group">

                    <label>Customer Name</label>

                    <input
                        type="text"
                        id="orderCustomer"
                        placeholder="Walk-in Customer"
                        required>

                </div>


                <!-- Products -->

                <div class="form-group">

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin-bottom:10px;
                    ">

                        <label style="margin:0;">
                            Products
                        </label>

                        <button
                            type="button"
                            class="btn-secondary"
                            id="addOrderItemBtn">

                            <i class="fa-solid fa-plus"></i>

                            Add Product

                        </button>

                    </div>


                    <div id="orderItemsContainer">

                        <!-- Product rows are added by orders.js -->

                    </div>

                </div>


                <!-- Order Total -->

                <div
                    class="form-group"
                    style="
                        text-align:right;
                        font-size:18px;
                        font-weight:600;
                    ">

                    Total:

                    <span id="orderGrandTotal">
                        ₹0.00
                    </span>

                </div>


                <!-- Status -->

                <div class="form-group">

                    <label>Status</label>

                    <select id="orderStatus">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn-secondary"
                    id="cancelOrderBtn">

                    Cancel

                </button>

                <button
                    type="button"
                    class="btn-primary"
                    id="saveOrderBtn">

                    Save Order

                </button>

            </div>

        </form>

    </div>

</div>
