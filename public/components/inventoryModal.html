<div id="inventoryModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="inventoryModalTitle">

                Stock Update

            </h2>

            <button id="closeInventoryModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="modal-body">

            <input
                type="hidden"
                id="inventoryProductId">

            <div class="form-group">

                <label>Product</label>

                <input
                    type="text"
                    id="inventoryProductName"
                    readonly>

            </div>

            <div class="form-group">

                <label>Current Stock</label>

                <input
                    type="number"
                    id="currentStock"
                    readonly>

            </div>

            <div class="form-group">

                <label>Quantity</label>

                <input
                    type="number"
                    id="inventoryQuantity"
                    min="1"
                    value="1">

            </div>

            <div class="form-group">

                <label>Remarks</label>

                <textarea
                    id="inventoryRemarks"
                    rows="3"
                    placeholder="Enter remarks (optional)"></textarea>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn-secondary"
                id="cancelInventoryBtn">

                Cancel

            </button>

            <button
                class="btn-primary"
                id="saveInventoryBtn">

                Update Stock

            </button>

        </div>

    </div>

</div>
