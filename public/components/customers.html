<div class="customers-page">

    <div class="products-header">

        <div style="margin:15px 0;">

    <input
        id="customerSearch"
        type="text"
        placeholder="🔍 Search customers..."
        onkeyup="searchCustomers()"
        style="
            width:320px;
            padding:10px;
            border:1px solid #ddd;
            border-radius:8px;
        ">

</div>

        <h2 class="page-title">

            Customers

        </h2>

        <button
            class="btn-primary"
            id="addCustomerBtn">

            <i class="fa-solid fa-plus"></i>

            Add Customer

        </button>

    </div>

    <div class="table-container">

        <table class="product-table">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>City</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="customerTable">

                <tr>

                    <td colspan="7" style="text-align:center;padding:30px;">

                        Loading customers...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>
