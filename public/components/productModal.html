<div id="productModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Add Product</h2>

            <button id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="modal-body">

            <div class="form-group">

                <label>Product Name</label>

                <input
                    id="productName"
                    type="text">

            </div>

            <div class="form-group">

                <label>Category</label>

                <input
                    id="productCategory"
                    type="text">

            </div>

            <div class="form-group">

                <label>Price</label>

                <input
                    id="productPrice"
                    type="number">

            </div>

            <div class="form-group">

                <label>Stock</label>

                <input
                    id="productStock"
                    type="number">

            </div>

            <div class="form-group">

                <label>Status</label>

                <select id="productStatus">

                    <option>Active</option>

                    <option>Inactive</option>

                </select>

            </div>

        </div>

        <div class="modal-footer">

            <button
                class="btn-secondary"
                id="cancelBtn">

                Cancel

            </button>

            <button
                class="btn-primary"
                id="saveBtn">

                Save Product

            </button>

        </div>

    </div>

</div>
